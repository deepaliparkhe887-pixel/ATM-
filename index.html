<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ATM Transaction System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="atm-container">

        <header>
            <div class="bank-icon">🏦</div>
            <h1>ATM Transaction System</h1>
            <p>Secure Banking Interface</p>
        </header>

        <div class="atm-card">

            <div class="screen">
                <p class="screen-title">ACCOUNT BALANCE</p>

                <h2 id="balance">₹5,000</h2>

                <p id="status">Please enter your PIN</p>
            </div>

            <div class="pin-section">
                <label for="pin">Enter 4-Digit PIN</label>

                <input
                    type="password"
                    id="pin"
                    maxlength="4"
                    inputmode="numeric"
                    placeholder="••••"
                    autocomplete="off"
                >

                <button id="loginBtn" type="button">
                    VERIFY PIN
                </button>
            </div>

            <div id="transactionSection" class="hidden">

                <h3>Select Transaction</h3>

                <button id="balanceBtn" type="button">
                    BALANCE ENQUIRY
                </button>

                <div class="amount-section">

                    <label for="amount">Enter Amount (₹)</label>

                    <input
                        type="number"
                        id="amount"
                        min="1"
                        step="1"
                        placeholder="Enter amount"
                    >

                    <button id="withdrawBtn" type="button">
                        WITHDRAW
                    </button>

                    <button id="depositBtn" type="button">
                        DEPOSIT
                    </button>

                </div>

                <h3>Transaction History</h3>

                <ul id="history">
                    <li>No transactions yet</li>
                </ul>

            </div>

            <button id="resetBtn" class="reset-btn" type="button">
                RESET ATM
            </button>

        </div>

        <footer>
            Educational Project | Verilog HDL
        </footer>

    </div>

    <script src="script.js"></script>

</body>
</html>
